<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Terra Ablisseus</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d18; }
      body { font-family: Georgia, 'Times New Roman', serif; color: #f4efe6; }
      canvas#scene { display: block; width: 100%; height: 100%; touch-action: none; }

      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.2rem;
        background: radial-gradient(ellipse at center, rgba(11,13,24,0.35), rgba(11,13,24,0.85));
        cursor: pointer; transition: opacity 1.8s ease; text-align: center; padding: 1rem;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay h1 { font-weight: normal; letter-spacing: 0.45em; font-size: clamp(1.4rem, 5vw, 3rem); margin: 0; text-indent: 0.45em; }
      #overlay p { margin: 0; opacity: 0.75; letter-spacing: 0.15em; font-size: 0.9rem; }
      #overlay .keys { opacity: 0.45; font-size: 0.75rem; }

      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 4px; height: 4px; border-radius: 50%;
        transform: translate(-50%, -50%); background: #fff; opacity: 0;
        box-shadow: 0 0 2px rgba(0,0,0,0.7); pointer-events: none; transition: opacity 0.6s;
      }

      #biome {
        position: fixed; top: 16%; left: 0; right: 0; text-align: center;
        font-size: clamp(1rem, 2.6vw, 1.6rem); letter-spacing: 0.4em; text-indent: 0.4em;
        opacity: 0; transition: opacity 2s ease; pointer-events: none;
        text-shadow: 0 1px 8px rgba(0,0,0,0.55);
      }
      #biome.show { opacity: 0.85; }

      /* The map (M). The canvas is painted by map.js; the marker is moved every frame. */
      #map {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(8, 9, 16, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
      }
      #map.show { opacity: 1; }
      #map-sheet {
        position: relative; width: min(88vh, 88vw); height: min(88vh, 88vw);
        box-shadow: 0 10px 50px rgba(0,0,0,0.6); transform: rotate(-0.6deg) scale(0.97); transition: transform 0.35s ease;
      }
      #map.show #map-sheet { transform: rotate(-0.6deg) scale(1); }
      #map-canvas { width: 100%; height: 100%; display: block; }
      #map-marker {
        position: absolute; width: 0; height: 0;
        border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 18px solid #c0281a;
        filter: drop-shadow(0 0 2px #fff) drop-shadow(0 1px 2px rgba(0,0,0,0.6));
      }
      #map-button {
        position: fixed; top: 0.8rem; right: 0.8rem; padding: 0.45rem 0.9rem; display: none;
        font: inherit; font-size: 0.8rem; letter-spacing: 0.15em; color: #f4efe6;
        background: rgba(11,13,24,0.45); border: 1px solid rgba(244,239,230,0.35); border-radius: 4px;
      }
      @media (pointer: coarse) { #map-button { display: block; } }

      #hint {
        position: fixed; bottom: 1.2rem; left: 0; right: 0; text-align: center;
        font-size: 0.8rem; letter-spacing: 0.15em; opacity: 0; transition: opacity 0.6s;
        pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      }
      #hint.show { opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">
      <h1>TERRA ABLISSEUS</h1>
      <p id="overlay-status">loading…</p>
      <p class="keys">WASD / arrows to walk · mouse to look · shift to hurry · space to jump · M for map · G for tweak panel</p>
    </div>
    <div id="crosshair"></div>
    <div id="biome"></div>
    <div id="map"><div id="map-sheet"><canvas id="map-canvas"></canvas><div id="map-marker"></div></div></div>
    <button id="map-button">MAP</button>
    <div id="hint">click to continue</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
